name: Android Production App Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Public release version, for example 1.0.0
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: Increasing Google Play build number
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    steps:
      - name: Check out FoodTrekNow
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run application tests
        run: npm test

      - name: Build and synchronize public assets
        run: npm run mobile:sync:android

      - name: Validate release version
        env:
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Version code must be a positive integer."; exit 1; }
          [[ "$RELEASE_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version name must use the format 1.0.0."; exit 1; }

      - name: Restore protected Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret."; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "Missing ANDROID_KEY_ALIAS secret."; exit 1; }
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || { echo "Missing ANDROID_KEY_PASSWORD secret."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foodtreknow-upload.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed Google Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/foodtreknow-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
        run: >-
          ./android/gradlew -p android bundleRelease --no-daemon
          -PFOODTREKNOW_VERSION_NAME="$RELEASE_VERSION_NAME"
          -PFOODTREKNOW_VERSION_CODE="$RELEASE_VERSION_CODE"

      - name: Verify bundle signature and checksum
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload signed FoodTrekNow bundle
        uses: actions/upload-artifact@v4
        with:
          name: FoodTrekNow-Android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
