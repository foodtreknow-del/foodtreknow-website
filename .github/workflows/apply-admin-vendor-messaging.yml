name: Apply administrator vendor messaging release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-admin-vendor-messaging.yml"

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested release commits
        shell: bash
        run: |
          base64 --decode .github/patches/admin-vendor-messaging-1.0.28.patch.gz.b64 | gunzip > /tmp/release.mbox
          sed -i 's/\r$//' /tmp/release.mbox
          git config user.name "foodtreknow-del"
          git config user.email "foodtreknow@gmail.com"
          mkdir -p /tmp/mail
          git mailsplit -o/tmp/mail /tmp/release.mbox
          for mail in /tmp/mail/*; do
            git mailinfo /tmp/message /tmp/change.patch < "$mail"
            git apply --ignore-space-change --ignore-whitespace /tmp/change.patch
            git add -A
            git commit -F /tmp/message
          done
          git push origin HEAD:main
